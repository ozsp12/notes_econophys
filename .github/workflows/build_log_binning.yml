name: Build log binning experiments

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "log_binning/stg_01_run_experiments.py"
      - "requirements.txt"
      - ".github/workflows/build_log_binning.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run experiments
        run: python log_binning/stg_01_run_experiments.py

      - name: Validate outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("log_binning")
          csv_path = root / "binning_experiments.csv"
          if not csv_path.is_file():
              raise SystemExit("Missing binning_experiments.csv")

          df = pd.read_csv(csv_path)
          expected_columns = [
              "distribution", "method", "N", "K", "bin_id",
              "bin_left", "bin_right", "bin_width", "bin_center",
              "count", "frequency", "density", "mean", "median",
              "std", "min", "max", "p90", "p99",
          ]
          if df.columns.tolist() != expected_columns:
              raise SystemExit(f"Unexpected CSV schema: {df.columns.tolist()}")
          if len(df) != 4725:
              raise SystemExit(f"Expected 4725 bin rows, got {len(df)}")

          pngs = sorted(root.glob("*.png"))
          if len(pngs) != 15:
              raise SystemExit(f"Expected 15 PNG figures, got {len(pngs)}")

          print(f"Validated {len(df):,} CSV rows and {len(pngs)} figures.")
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log_binning/binning_experiments.csv log_binning/*.png
          if git diff --cached --quiet; then
            echo "Log-binning assets are already up to date."
          else
            git commit -m "Build log binning experiment assets"
            git push
          fi
