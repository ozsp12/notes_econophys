name: Build log binning experiments

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "log_binning/generate_log_binning_assets.py"
      - "requirements.txt"
      - ".github/workflows/build_log_binning.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Remove generated outputs
        run: |
          rm -f log_binning/figure_*.png
          rm -f log_binning/table_*.csv

      - name: Run experiments
        run: python log_binning/generate_log_binning_assets.py

      - name: Validate outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("log_binning")
          table_path = root / "table_binning_experiments.csv"
          if not table_path.is_file():
              raise SystemExit("Missing table_binning_experiments.csv")

          df = pd.read_csv(table_path)
          expected_columns = [
              "distribution", "method", "N", "K", "bin_id",
              "bin_left", "bin_right", "bin_width", "bin_center",
              "count", "frequency", "density", "mean", "median",
              "std", "min", "max", "p90", "p99",
          ]
          if df.columns.tolist() != expected_columns:
              raise SystemExit(f"Unexpected CSV schema: {df.columns.tolist()}")
          if len(df) != 1575:
              raise SystemExit(f"Expected 1575 bin rows, got {len(df)}")
          if df["N"].nunique() != 1 or int(df["N"].iloc[0]) != 1_000_000:
              raise SystemExit("CSV must contain only N=1,000,000")

          expected_figures = {
              "figure_histograms.png",
              "figure_ccdf_grid.png",
              "figure_ccdf_grid_no_title.png",
              "figure_bin_means_grid.png",
              "figure_newman_powerlaw_grid.png",
              "figure_newman_panel_a.png",
              "figure_newman_panel_b.png",
              "figure_newman_panel_c.png",
              "figure_newman_panel_d.png",
          }
          figures = {p.name for p in root.glob("*.png")}
          if figures != expected_figures:
              raise SystemExit(f"Unexpected PNG set: {sorted(figures)}")
          if not all(name.startswith("figure_") for name in figures):
              raise SystemExit("Every figure must use the figure_ prefix")

          csv_files = sorted(p.name for p in root.glob("*.csv"))
          if csv_files != ["table_binning_experiments.csv"]:
              raise SystemExit(f"Unexpected CSV files: {csv_files}")

          py_files = sorted(p.name for p in root.glob("*.py"))
          if py_files != ["generate_log_binning_assets.py"]:
              raise SystemExit(f"Unexpected Python files in log_binning: {py_files}")

          if (root / "assets").exists():
              raise SystemExit("The assets directory must not exist")
          if (root / "sections").exists():
              raise SystemExit("The sections directory must not exist")

          print(
              f"Validated {len(df):,} table rows, {len(figures)} figures, "
              "flat directory structure, and one Python generator."
          )
          PY

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A log_binning
          if git diff --cached --quiet; then
            echo "Log-binning outputs are already up to date."
          else
            git commit -m "Build log binning outputs"
            git push
          fi
