name: Build log-MAD PNAD histograms

on:
  push:
    branches:
      - main
    paths:
      - "log_mad_outlier/generate_pnad_histograms.py"
      - ".github/workflows/build_log_mad_outlier_histograms.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install numpy pandas matplotlib pyarrow

      - name: Generate PNAD histogram figures
        run: |
          python log_mad_outlier/generate_pnad_histograms.py \
            --output-dir log_mad_outlier

      - name: Validate generated PNG files
        run: |
          test -s log_mad_outlier/figure_pnad_refined_histograms.png
          test -s log_mad_outlier/figure_pnad_trusted_histograms.png
          file log_mad_outlier/figure_pnad_refined_histograms.png
          file log_mad_outlier/figure_pnad_trusted_histograms.png

      - name: Commit generated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            log_mad_outlier/figure_pnad_refined_histograms.png \
            log_mad_outlier/figure_pnad_trusted_histograms.png
          if git diff --cached --quiet; then
            echo "PNAD histogram figures are already up to date."
          else
            git commit -m "Generate PNAD refined and trusted histograms"
            git push
          fi
