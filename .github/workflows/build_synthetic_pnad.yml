# Reproducible build of the canonical synthetic PNAD dataset.
name: Build synthetic PNAD dataset

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/stg_01_synthetic_gompertz_pareto.py"
      - "data/metadata/pnad_gompertz_pareto.csv"
      - "data/metadata/statistics_annual.csv"
      - "requirements.txt"
      - ".github/workflows/build_synthetic_pnad.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build synthetic dataset
        run: python src/stg_01_synthetic_gompertz_pareto.py

      - name: Validate Parquet
        run: |
          python - <<'PY'
          from pathlib import Path
          import pyarrow.parquet as pq

          path = Path("data/synthetic/pnad_gompertz_pareto.parquet")
          if not path.is_file():
              raise SystemExit("Synthetic Parquet was not generated.")

          parquet = pq.ParquetFile(path)
          schema = parquet.schema_arrow.names
          if schema != ["year", "income"]:
              raise SystemExit(f"Unexpected schema: {schema}")
          if parquet.metadata.num_row_groups != 50:
              raise SystemExit(
                  f"Expected 50 annual row groups, got {parquet.metadata.num_row_groups}."
              )
          if parquet.metadata.num_rows <= 0:
              raise SystemExit("Synthetic Parquet is empty.")

          print(
              f"Validated {parquet.metadata.num_rows:,} rows, "
              f"{parquet.metadata.num_row_groups} years, "
              f"{path.stat().st_size / 1024**2:.2f} MiB."
          )
          PY

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/synthetic/pnad_gompertz_pareto.parquet
          if git diff --cached --quiet; then
            echo "Synthetic dataset is already up to date."
          else
            git commit -m "Build synthetic PNAD dataset"
            git push
          fi
